<div class="map-wrapper">
  <div #mapContainer class="leaflet-container-box"></div>

  <div class="map-legend">
    <div class="legend-title">Map Legend</div>
    <div class="legend-items">
      <div class="legend-item"><span class="legend-swatch pickup">📦</span> Open Pickup</div>
      <div class="legend-item"><span class="legend-swatch dropoff">📍</span> Selected Dropoff</div>
      <div class="legend-item"><span class="legend-swatch available">🟢</span> Available Driver</div>
      <div class="legend-item"><span class="legend-swatch on-job">⚪</span> On-Job Driver</div>
      <div class="legend-item"><span class="legend-swatch suggested">🌟</span> Suggested Driver (#1-#3)</div>
    </div>
  </div>
</div>
